<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Burn</title>
  <meta name="description" content="A cavern-flying arcade game you steer by pedalling your smart trainer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0b'/%3E%3Cpath d='M27 16 6 7l5 9-5 9z' fill='none' stroke='%23F1EFE8' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M9 19l2 7 2-7' fill='none' stroke='%23EF9F27' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #1a1a19;
      --line: #2C2C2A;
      --track: #444441;
      --muted: #888780;
      --soft: #B4B2A9;
      --text: #F1EFE8;
      --accent: #1D9E75;
      --accent-dark: #0F6E56;
      --accent-text: #E1F5EE;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    #status { position: fixed; display: flex; gap: 12px; align-items: center; justify-content: center;
      font-size: 14px; color: var(--soft); pointer-events: none; }
    #status[hidden] { display: none; }
    #status button { pointer-events: auto; }

    button { font: inherit; font-size: 13px; color: var(--text); background: transparent;
      border: 1px solid #5F5E5A; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button:hover { background: var(--line); }

    #start { position: fixed; transform: translateX(-50%); font-size: 18px; padding: 12px 40px;
      background: #0F6E56; border-color: #1D9E75; color: #E1F5EE; }
    #start:hover { background: #1D9E75; }
    #start[hidden] { display: none; }

    #tip { position: fixed; z-index: 10; width: 260px; box-sizing: border-box; padding: 10px 12px;
      background: #232322; border: 1px solid #444441; border-radius: 8px; color: var(--soft);
      font-size: 13px; line-height: 1.45; pointer-events: none; }
    #tip[hidden] { display: none; }

    #panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 288px; box-sizing: border-box;
      padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      overflow-y: auto; font-size: 13px; }
    #panel.hidden { display: none; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 15px; font-weight: 500; }
    kbd { font: inherit; font-size: 12px; color: var(--muted); border: 1px solid #5F5E5A; border-radius: 4px; padding: 1px 6px; }


    .row { display: block; padding-top: 10px; }
    .row-head { display: flex; justify-content: space-between; color: var(--soft); }
    .row-head output { color: var(--text); font-variant-numeric: tabular-nums; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0;
      background: transparent; cursor: pointer; --fill: 50%; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
      background: linear-gradient(to right, var(--accent) var(--fill), var(--track) var(--fill)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px;
      border-radius: 50%; background: var(--text); }
    input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .check { display: flex; gap: 8px; align-items: center; color: var(--soft); margin: 12px 0; }
    .buttons { display: flex; gap: 8px; }
    .buttons button { flex: 1; }
    .buttons + .buttons { margin-top: 8px; }
    .note { min-height: 1.4em; margin: 8px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="status" role="status"></div>
  <button id="start" type="button">Start</button>
  <aside id="panel" aria-label="Tuning"></aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
